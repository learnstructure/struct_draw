[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "struct_draw"
version = "0.1.0"
description = "Drawing generation library for the Structural Engineering Ecosystem (DXF first-class)."
readme = "README.md"
authors = [
    { name = "Structural Engineering Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "ezdxf>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["struct_draw*"]

[tool.pytest.ini_options]
# Adds the project root to sys.path so 'import struct_draw' works in tests.
# For scripts/examples outside of pytest, run: pip install -e .
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88